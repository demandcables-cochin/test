<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Helios Orrery — Interactive Solar System</title>
    <meta
      name="description"
      content="An interactive orrery of the Solar System: watch all eight planets orbit the Sun, click a world for its dossier, and control the flow of time."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='9' fill='%23ffb54d'/%3E%3Ccircle cx='16' cy='16' r='13.5' fill='none' stroke='%238b93b8' stroke-width='1.4' stroke-dasharray='3 5'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #05040f;
      }
    </style>
    <script>
      // Report runtime errors to the sandbox parent (kept from workspace template).
      (function () {
        if (window.self === window.top) return;
        var reported = {};
        window.addEventListener("error", function (event) {
          if (!event || !event.message) return;
          var key =
            event.message + "|" + (event.filename || "") + "|" + (event.lineno || 0);
          if (reported[key]) return;
          reported[key] = true;
          try {
            window.parent.postMessage(
              {
                type: "sandbox-runtime-error",
                payload: {
                  message: String(event.message).slice(0, 500),
                  filename: String(event.filename || ""),
                  lineno: Number(event.lineno || 0),
                  colno: Number(event.colno || 0),
                  stack: String((event.error && event.error.stack) || "").slice(0, 2000),
                },
              },
              "*"
            );
          } catch (e) {}
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
